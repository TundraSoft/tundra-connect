workflows:
  - changed-files:
      - any-glob-to-any-file: .github/workflows/*
infra:
  - changed-files:
      - any-glob-to-any-file:
          - deno.json
          - package.json
          - release-please-config.json
          - .release-please-manifest.json
documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/README.md', '**/CHANGELOG.md']

