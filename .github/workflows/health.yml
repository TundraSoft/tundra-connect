name: Weekly Health Check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: Test (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, deno-canary, bun, node-22, node-24, node-current]
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        if: startsWith(matrix.runtime, 'deno')
        with:
          deno-version: ${{ matrix.runtime == 'deno-canary' && 'canary' || 'v2.x' }}
      - run: deno task test
        if: startsWith(matrix.runtime, 'deno')

      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
      - run: bun install && bun run test:bun
        if: matrix.runtime == 'bun'

      - uses: actions/setup-node@v7
        if: startsWith(matrix.runtime, 'node')
        with:
          node-version: ${{ matrix.runtime == 'node-current' && 'current' || (matrix.runtime == 'node-22' && '22' || '24') }}
      - uses: oven-sh/setup-bun@v2
        if: startsWith(matrix.runtime, 'node')
      # npm can't resolve the `@jsr/*` scope without a local .npmrc (which is
      # gitignored); bun already knows this scope via bunfig.toml, so it
      # populates node_modules for the Node run too.
      - run: bun install && npm run test:node
        if: startsWith(matrix.runtime, 'node')

  audit:
    name: Full dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno audit

  consumer-docs:
    name: Consumer doc drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno run --allow-read --allow-net --allow-run --allow-write .github/scripts/consumer-doc-check.ts

  report:
    name: Report failures
    needs: [test, audit, consumer-docs]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.github/ISSUE_TEMPLATE/ci_health.md', 'utf8')
              .replace(/^---[\s\S]*?---\n/, '');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ci-health',
              state: 'open',
            });
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const fullBody = `${body}\n\nFailed run: ${runUrl}`;
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: fullBody,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Weekly health check failed',
                labels: ['ci-health'],
                body: fullBody,
              });
            }
